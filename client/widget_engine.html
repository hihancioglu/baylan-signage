<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Baylan Widget Engine</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
    #widgets { display: grid; gap: 12px; width: 100%; height: 100%; box-sizing: border-box; padding: 12px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
    #widgets.production-grid-layout { display: flex; padding: 0; gap: 0; }
    .production-grid-stage { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4px; margin: auto; }
    .production-grid-stage > .widget { flex: 0 0 auto; margin: 0; border-radius: 0; }
    .widget { min-width: 0; min-height: 0; border: 0; border-radius: 8px; overflow: hidden; background: #111; }
    .iframe-widget { position: relative; }
    .production-auto-fit { position: relative; overflow: hidden; }
    .production-fit-stage { position: absolute; left: 50%; top: 50%; transform-origin: center center; }
    .production-fit-stage iframe { width: 100%; height: 100%; border: 0; }
    iframe.widget {
      width: 100%;
      height: 100%;
      display: block;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    iframe.widget::-webkit-scrollbar { display: none; }
    .iframe-fallback {
      display: none;
      position: absolute;
      inset: 0;
      padding: 18px;
      box-sizing: border-box;
      background: #171717;
      color: #f5f5f5;
      font-size: 18px;
      line-height: 1.45;
    }
    .iframe-fallback a { color: #7db6ff; }
    .iframe-widget.blocked .iframe-fallback { display: block; }
    .iframe-widget.blocked iframe { visibility: hidden; }
    .card { padding: 16px; font-size: 24px; display: flex; align-items: center; justify-content: center; }
    .empty-cell { background: transparent; border: 1px dashed rgba(255,255,255,0.15); }
    .media-widget { position: relative; display:flex; align-items:center; justify-content:center; background:#000; }
    .media-widget img, .media-widget video { width:100%; height:100%; object-fit:contain; background:#000; }
  </style>
</head>
<body>
  <div id="widgets"></div>
  <script>
    const debugEnabled = (() => {
      const params = new URLSearchParams(window.location.search);
      const raw = String(params.get("debug") || "").trim().toLowerCase();
      return raw === "1" || raw === "true" || raw === "yes";
    })();
    const PRODUCTION_AUTO_HUB_SCALE = 1.0;
    const PRODUCTION_FIT_BASE_WIDTH = 620;
    const PRODUCTION_FIT_BASE_HEIGHT = 500;
    const PRODUCTION_FIT_SAFETY = 0.995;
    const PRODUCTION_GRID_GAP = 4;

    function isProductionAutoFitWidget(widget) {
      return String(widget?.fit_mode || "") === "production_auto";
    }

    function isSingleProductionAutoFitLayout(config) {
      const widgets = Array.isArray(config?.widgets) ? config.widgets : [];
      return (
        widgets.length === 1 &&
        String(widgets[0]?.type || "").toLowerCase() === "iframe" &&
        String(widgets[0]?.fit_mode || "") === "production_auto"
      );
    }

    function positiveFitNumber(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : fallback;
    }

    function finiteFitNumber(value, fallback) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function setupProductionAutoFit(wrapper, stage, widget, widgetIndex, config) {
      const fitWidth = positiveFitNumber(widget.fit_width, PRODUCTION_FIT_BASE_WIDTH);
      const fitHeight = positiveFitNumber(widget.fit_height, PRODUCTION_FIT_BASE_HEIGHT);
      const fitSafety = positiveFitNumber(widget.fit_safety, PRODUCTION_FIT_SAFETY);
      const fitOffsetX = finiteFitNumber(widget.fit_offset_x, 0);
      const fitOffsetY = finiteFitNumber(widget.fit_offset_y, 0);
      stage.style.width = `${fitWidth}px`;
      stage.style.height = `${fitHeight}px`;
      stage.style.left = `calc(50% + ${fitOffsetX}px)`;
      stage.style.top = `calc(50% + ${fitOffsetY}px)`;

      const updateFit = () => {
        const cellRect = wrapper.getBoundingClientRect();
        if (cellRect.width <= 0 || cellRect.height <= 0 || fitWidth <= 0 || fitHeight <= 0) return;
        const scaleX = cellRect.width / fitWidth;
        const scaleY = cellRect.height / fitHeight;
        const baseScale = Math.min(scaleX, scaleY) * fitSafety;
        if (!Number.isFinite(baseScale) || baseScale <= 0) return;
        stage.style.transform = `translate(-50%, -50%) scale(${baseScale})`;
        debugLog(
          "production-runtime-fit",
          `index=${widgetIndex} | cell=${cellRect.width.toFixed(1)}x${cellRect.height.toFixed(1)} | ` +
            `virtual=${fitWidth}x${fitHeight} | scaleX=${scaleX.toFixed(4)} | ` +
            `scaleY=${scaleY.toFixed(4)} | effectiveScale=${baseScale.toFixed(4)}`
        );
      };
      const observer = new ResizeObserver(updateFit);
      observer.observe(wrapper);
      wrapper.__cleanup = () => observer.disconnect();
      updateFit();
      return updateFit;
    }

    function debugLog(message, extra) {
      if (!debugEnabled) return;
      if (typeof extra === "undefined") {
        console.log(`[widget_engine] ${message}`);
        if (window.pywebview && window.pywebview.api) {
          try {
            if (typeof window.pywebview.api.debug_log === "function") {
              window.pywebview.api.debug_log(message, "");
            } else if (typeof window.pywebview.api.debugLog === "function") {
              window.pywebview.api.debugLog(message, "");
            }
          } catch (_err) {
            // noop
          }
        }
        return;
      }
      console.log(`[widget_engine] ${message}`, extra);
      if (window.pywebview && window.pywebview.api) {
        try {
          const serialized = typeof extra === "string" ? extra : JSON.stringify(extra);
          if (typeof window.pywebview.api.debug_log === "function") {
            window.pywebview.api.debug_log(message, serialized);
          } else if (typeof window.pywebview.api.debugLog === "function") {
            window.pywebview.api.debugLog(message, serialized);
          }
        } catch (_err) {
          // noop
        }
      }
    }

    function parseConfig() {
      const params = new URLSearchParams(window.location.search);
      const configB64 = params.get("config_b64");
      if (configB64) {
        try {
          return JSON.parse(atob(decodeURIComponent(configB64).replace(/-/g, "+").replace(/_/g, "/")));
        } catch (_err) {
          return { widgets: [] };
        }
      }
      const url = params.get("url");
      if (url) {
        return { widgets: [{ type: "iframe", url }] };
      }
      return { widgets: [] };
    }

    function normalizeConfig(input) {
      const fallback = { widgets: [] };
      if (!input || typeof input !== "object") {
        return fallback;
      }

      const widgets = Array.isArray(input.widgets) ? input.widgets.filter((w) => w && typeof w === "object") : [];
      const normalized = { widgets };
      const parsedRows = Number(input.rows);
      if (Number.isFinite(parsedRows) && parsedRows > 0) {
        normalized.rows = parsedRows;
      }
      if (Array.isArray(input.columns)) {
        normalized.columns = input.columns;
      } else {
        const parsedColumns = Number(input.columns);
        if (Number.isFinite(parsedColumns) && parsedColumns > 0) {
          normalized.columns = parsedColumns;
        }
      }
      return normalized;
    }

    function applyLayout(config) {
      const container = document.getElementById("widgets");
      const singleCardFit = isSingleProductionAutoFitLayout(config);
      const columns = Array.isArray(config.columns) ? config.columns.length : Number(config.columns || 1);
      const cols = singleCardFit ? 1 : Math.max(1, Number(columns) || 1);
      const widgetCount = Array.isArray(config.widgets) ? config.widgets.length : 0;
      container.style.setProperty("--cols", String(cols));
      const allProductionAutoFit = widgetCount > 0 && config.widgets.every(isProductionAutoFitWidget);
      container.classList.toggle("production-grid-layout", allProductionAutoFit);
      container.classList.toggle(
        "production-grid-single-fit",
        singleCardFit
      );

      if (allProductionAutoFit) {
        container.style.removeProperty("grid-template-rows");
        return;
      }

      const minRows = Number(config.rows || 0);
      const targetRows = singleCardFit ? 1 : Math.max(minRows, Math.ceil(widgetCount / cols));
      if (targetRows > 0) {
        container.style.gridTemplateRows = `repeat(${targetRows}, minmax(0, 1fr))`;
      } else {
        container.style.removeProperty("grid-template-rows");
      }
    }

    function optimizeProductionGrid(container, stage, config) {
      const widgets = Array.isArray(config.widgets) ? config.widgets : [];
      const count = widgets.length;
      if (!count) return () => {};
      const fitWidth = positiveFitNumber(widgets[0].fit_width, PRODUCTION_FIT_BASE_WIDTH);
      const fitHeight = positiveFitNumber(widgets[0].fit_height, PRODUCTION_FIT_BASE_HEIGHT);
      const cardAspect = fitWidth / fitHeight;

      const updateLayout = () => {
        const viewport = container.getBoundingClientRect();
        const availableWidth = viewport.width;
        const availableHeight = viewport.height;
        if (availableWidth <= 0 || availableHeight <= 0) return;
        let selected = null;
        const candidates = [];
        for (let columns = 1; columns <= count; columns += 1) {
          const rows = Math.ceil(count / columns);
          const maxCellWidthByScreen = (availableWidth - ((columns - 1) * PRODUCTION_GRID_GAP)) / columns;
          const maxCellHeightByScreen = (availableHeight - ((rows - 1) * PRODUCTION_GRID_GAP)) / rows;
          const cellWidth = Math.min(maxCellWidthByScreen, maxCellHeightByScreen * cardAspect);
          const cellHeight = cellWidth / cardAspect;
          const score = cellWidth * cellHeight;
          const candidate = { columns, rows, cellWidth, cellHeight, score, emptySlots: (columns * rows) - count };
          candidates.push(candidate);
          if (
            !selected ||
            score > selected.score * 1.005 ||
            (score >= selected.score * 0.995 && candidate.emptySlots < selected.emptySlots)
          ) selected = candidate;
        }
        if (!selected || selected.cellWidth <= 0 || selected.cellHeight <= 0) return;
        stage.style.width = `${(selected.columns * selected.cellWidth) + ((selected.columns - 1) * PRODUCTION_GRID_GAP)}px`;
        stage.style.height = `${(selected.rows * selected.cellHeight) + ((selected.rows - 1) * PRODUCTION_GRID_GAP)}px`;
        stage.querySelectorAll(":scope > .production-auto-fit").forEach((wrapper) => {
          wrapper.style.width = `${selected.cellWidth}px`;
          wrapper.style.height = `${selected.cellHeight}px`;
        });
        candidates.forEach((candidate) => debugLog(
          "production-grid-candidate",
          `${candidate.columns}x${candidate.rows} score=${candidate.score.toFixed(1)} empty=${candidate.emptySlots}`
        ));
        debugLog(
          "production-grid-layout",
          `viewport=${Math.round(availableWidth)}x${Math.round(availableHeight)} | count=${count} | ` +
            `selected=${selected.columns}x${selected.rows} | cardAspect=${cardAspect.toFixed(3)} | ` +
            `cell=${selected.cellWidth.toFixed(1)}x${selected.cellHeight.toFixed(1)} | ` +
            `virtual=${fitWidth}x${fitHeight} | hubScale=${PRODUCTION_AUTO_HUB_SCALE} | ` +
            `outerScale=${(Math.min(selected.cellWidth / fitWidth, selected.cellHeight / fitHeight) * PRODUCTION_FIT_SAFETY).toFixed(3)}`
        );
      };
      const observer = new ResizeObserver(updateLayout);
      observer.observe(container);
      updateLayout();
      return () => observer.disconnect();
    }

    let productionViewportLogTimer = null;
    function logProductionViewports() {
      if (!debugEnabled) return;
      window.clearTimeout(productionViewportLogTimer);
      productionViewportLogTimer = window.setTimeout(() => {
        document.querySelectorAll('iframe[data-instance-src]').forEach((frame) => {
          let url;
          try { url = new URL(frame.dataset.instanceSrc, window.location.href); } catch (_err) { return; }
          if (!url.pathname.includes('/automation/production-widget')) return;
          const bounds = frame.closest('.iframe-widget').getBoundingClientRect();
          debugLog('production viewport', {
            physical: `${Math.round(window.innerWidth * window.devicePixelRatio)}x${Math.round(window.innerHeight * window.devicePixelRatio)}`,
            css: `${Math.round(bounds.width)}x${Math.round(bounds.height)}`,
            devicePixelRatio: window.devicePixelRatio,
            scale_mode: frame.closest('.production-auto-fit') ? 'auto' : 'manual',
            widgetIndex: Number(frame.dataset.widgetIndex || -1),
          });
        });
      }, 150);
    }
    window.addEventListener('resize', logProductionViewports);

    function parseSpanValue(widget, keys, fallback = 1) {
      if (!widget || typeof widget !== "object") return fallback;
      for (const key of keys) {
        const raw = widget[key];
        const parsed = Number(raw);
        if (Number.isFinite(parsed) && parsed > 1) {
          return Math.floor(parsed);
        }
      }
      return fallback;
    }

    function isCellCoveredByPreviousSpan(widgets, index, cols) {
      if (!Array.isArray(widgets) || index <= 0 || cols <= 0) return false;
      const targetRow = Math.floor(index / cols);
      const targetCol = index % cols;
      for (let probe = 0; probe < index; probe += 1) {
        const widget = widgets[probe];
        if (!widget || typeof widget !== "object") continue;
        const probeRow = Math.floor(probe / cols);
        const probeCol = probe % cols;
        const colSpan = parseSpanValue(widget, ["col_span", "colspan", "column_span", "merge_cols"], 1);
        const rowSpan = parseSpanValue(widget, ["row_span", "rowspan", "merge_rows"], 1);
        if (
          targetRow >= probeRow &&
          targetRow < (probeRow + rowSpan) &&
          targetCol >= probeCol &&
          targetCol < (probeCol + colSpan)
        ) {
          return true;
        }
      }
      return false;
    }

    function normalizeIframeUrl(rawValue) {
      const value = String(rawValue || "").trim();
      if (!value) return "";
      const decoded = value
        .replace(/&quot;/gi, "\"")
        .replace(/&#39;|&apos;/gi, "'")
        .replace(/&lt;/gi, "<")
        .replace(/&gt;/gi, ">")
        .replace(/&amp;/gi, "&");
      const iframeSrcMatch = decoded.match(/<iframe[\s\S]*?\bsrc\s*=\s*(['"])(.*?)\1/i);
      const rawSrcMatch = decoded.match(/\bsrc\s*=\s*(['"])(.*?)\1/i);
      const candidate = String(iframeSrcMatch && iframeSrcMatch[2] ? iframeSrcMatch[2] : (rawSrcMatch && rawSrcMatch[2] ? rawSrcMatch[2] : value)).trim();
      if (!candidate) return "";
      if (/^(https?:|file:|blob:|data:)/i.test(candidate)) return candidate;
      if (candidate.startsWith("//")) return `${window.location.protocol}${candidate}`;
      if (candidate.startsWith("/")) return `${window.location.origin}${candidate}`;
      return `https://${candidate}`;
    }


    function scheduleIframeLoad(frame, url, widgetIndex = -1, reloadPolicy = "default", beforeNavigate = null) {
      const source = normalizeIframeUrl(url);
      frame.name = `baylan-widget-frame-${Math.max(0, widgetIndex)}-${Math.random().toString(36).slice(2)}`;
      frame.dataset.originalSrc = source;
      frame.dataset.instanceSrc = source;
      frame.dataset.widgetIndex = String(widgetIndex);
      frame.dataset.reloadPolicy = String(reloadPolicy || "default").toLowerCase();
      window.requestAnimationFrame(() => {
        if (typeof beforeNavigate === "function") beforeNavigate();
        frame.dataset.navigationStarted = "true";
        debugLog("iframe initial navigation", {
          widgetIndex,
          reloadPolicy: frame.dataset.reloadPolicy,
          url: source,
        });
        frame.src = source;
        logProductionViewports();
      });
      return source;
    }

    function buildIframeFallback(url) {
      const fallback = document.createElement("div");
      fallback.className = "iframe-fallback";
      fallback.innerHTML = `
        <strong>Bu site iframe içinde açılamadı.</strong><br />
        Bazı siteler güvenlik politikası nedeniyle gömülü gösterimi engeller (X-Frame-Options / CSP).<br /><br />
        URL: <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>
      `;
      return fallback;
    }

    function inspectIframeState(frame) {
      try {
        const doc = frame.contentDocument;
        if (!doc) return { status: "unknown" };

        const locationHref = String(doc.location && doc.location.href || "").toLowerCase();
        const title = String(doc.title || "").toLowerCase();
        const bodyText = String(doc.body && doc.body.innerText || "").toLowerCase();
        const combinedText = `${title} ${bodyText}`;
        const transientConnectionKeywords = [
          "refused to connect",
          "connection refused",
          "bağlantıyı reddetti",
          "siteye ulaşılamıyor",
          "site can\'t be reached",
          "err_connection_refused",
        ];
        const blockedKeywords = [
          "x-frame-options",
          "frame-ancestors",
          "can't be displayed",
          "cannot be displayed",
          "içinde görüntülenemiyor",
        ];

        if (transientConnectionKeywords.some((keyword) => combinedText.includes(keyword))) {
          return { status: "transient_connection" };
        }

        if (blockedKeywords.some((keyword) => combinedText.includes(keyword))) {
          return { status: "blocked" };
        }

        if (locationHref === "about:blank") {
          return { status: "pending" };
        }

        return { status: "ready" };
      } catch (_err) {
        // Cross-origin içeriklere erişim normalde kısıtlıdır; bu durumda yükleme başarılı kabul edilir.
        return { status: "ready" };
      }
    }

    function nudgeIframePaint(frame, reason = "paint_nudge") {
      if (!frame) return;
      const wrapper = frame.closest ? frame.closest(".iframe-widget") : null;
      const targets = wrapper ? [wrapper, frame] : [frame];
      targets.forEach((target) => {
        try {
          target.style.transform = "translateZ(0) scale(1.0001)";
          target.style.opacity = "0.9999";
          // offsetHeight forces a synchronous layout read, similar to the
          // compositor invalidation that happens when the mouse hovers a stuck
          // WebView2 iframe surface.
          void target.offsetHeight;
          window.setTimeout(() => {
            target.style.transform = "translateZ(0)";
            target.style.opacity = "";
          }, 90);
        } catch (_err) {
          // noop
        }
      });
      debugLog("iframe paint nudged", {
        reason,
        widgetIndex: Number(frame.dataset && frame.dataset.widgetIndex || -1),
        url: String(frame.dataset && frame.dataset.instanceSrc || frame.currentSrc || frame.src || ""),
      });
    }

    function attachIframeBlockDetection(wrapper, frame, onBlocked) {
      let settled = false;
      let loadedAtLeastOnce = false;
      const stablePolicy = frame.dataset.reloadPolicy === "stable";
      const initialLoadWaitMs = stablePolicy ? 30000 : 8000;
      const maxInitialHardReloads = stablePolicy ? 1 : 4;
      const pollMs = 1500;
      const maxTransientRetries = 4;
      const maxPendingRetries = 4;
      const retryDelayMs = 1000;
      const longRetryDelayMs = 10000;
      let transientRetryCount = 0;
      let pendingRetryCount = 0;
      let noLoadRetryCount = 0;
      let loadWatchdog = null;
      const baseSrc = () => String(frame.dataset.instanceSrc || frame.currentSrc || frame.src || "");

      const clearLoadWatchdog = () => {
        if (loadWatchdog) {
          window.clearTimeout(loadWatchdog);
          loadWatchdog = null;
        }
      };

      const armLoadWatchdog = () => {
        clearLoadWatchdog();
        if (settled) return;
        loadWatchdog = window.setTimeout(() => {
          if (settled || loadedAtLeastOnce) return;
          if (noLoadRetryCount >= maxInitialHardReloads) {
            debugLog("iframe initial retry limit reached", {
              widgetIndex: Number(frame.dataset.widgetIndex || -1),
              retryCount: noLoadRetryCount,
              url: baseSrc(),
            });
            return;
          }
          nudgeFramePaint();
          noLoadRetryCount += 1;
          debugLog("iframe initial hard retry", {
            widgetIndex: Number(frame.dataset.widgetIndex || -1),
            retryCount: noLoadRetryCount,
            url: baseSrc(),
          });
          reloadWithCacheBust();
        }, initialLoadWaitMs);
      };

      const reloadWithCacheBust = () => {
        const currentBaseSrc = baseSrc();
        if (!currentBaseSrc) return;
        loadedAtLeastOnce = false;
        const separator = currentBaseSrc.includes("?") ? "&" : "?";
        frame.src = `${currentBaseSrc}${separator}_retry=${Date.now()}`;
        armLoadWatchdog();
      };

      const nudgeFramePaint = () => nudgeIframePaint(frame, "load_watchdog");

      const block = () => {
        if (settled) return;
        settled = true;
        clearLoadWatchdog();
        wrapper.classList.add("blocked");
        if (typeof onBlocked === "function") {
          onBlocked();
        }
      };
      const success = () => {
        if (settled) return;
        settled = true;
        frame.dataset.loadState = "settled";
        clearLoadWatchdog();
        debugLog("iframe settled", {
          widgetIndex: Number(frame.dataset.widgetIndex || -1),
          reloadPolicy: frame.dataset.reloadPolicy || "default",
          url: baseSrc(),
        });
      };

      const verifyFrame = () => {
        if (settled || !loadedAtLeastOnce) return;
        const state = inspectIframeState(frame);
        if (!state || state.status === "ready") {
          success();
          return;
        }
        if (state.status === "blocked") {
          block();
          return;
        }
        if (state.status === "transient_connection") {
          transientRetryCount += 1;
          window.setTimeout(() => {
            if (settled) return;
            reloadWithCacheBust();
          }, transientRetryCount <= maxTransientRetries ? retryDelayMs : longRetryDelayMs);
          return;
        }
        if (state.status === "pending") {
          nudgeFramePaint();
          pendingRetryCount += 1;
          window.setTimeout(() => {
            if (settled) return;
            reloadWithCacheBust();
          }, pendingRetryCount <= maxPendingRetries ? retryDelayMs : longRetryDelayMs);
          return;
        }
        window.setTimeout(verifyFrame, pollMs);
      };

      frame.addEventListener("error", block);
      frame.addEventListener("load", () => {
        // Ignore the iframe element's implicit about:blank document. Only the
        // navigation scheduled above can settle the widget.
        if (frame.dataset.navigationStarted !== "true") return;
        loadedAtLeastOnce = true;
        clearLoadWatchdog();
        debugLog("iframe load success", {
          widgetIndex: Number(frame.dataset.widgetIndex || -1),
          reloadPolicy: frame.dataset.reloadPolicy || "default",
          url: baseSrc(),
        });
        if (stablePolicy) {
          success();
          return;
        }
        verifyFrame();
      });

      armLoadWatchdog();
    }

    function recoverUnsettledIframes(reason = "runtime_refresh", options = {}) {
      const force = options && options.force === true;
      const minRecoverIntervalMs = Number(options && options.minRecoverIntervalMs || 60000);
      document.querySelectorAll(".iframe-widget iframe[data-instance-src]").forEach((frame) => {
        const wrapper = frame.closest(".iframe-widget");
        if (!wrapper || wrapper.classList.contains("blocked")) return;
        const state = inspectIframeState(frame);
        const stablePolicy = frame.dataset.reloadPolicy === "stable";
        if (stablePolicy) {
          debugLog("iframe recovery skipped: stable policy", {
            reason,
            widgetIndex: Number(frame.dataset.widgetIndex || -1),
            state: state ? state.status : "unknown",
          });
          return;
        }
        if (state && state.status === "ready") {
          debugLog("iframe recovery skipped: ready", {
            reason,
            widgetIndex: Number(frame.dataset.widgetIndex || -1),
            reloadPolicy: frame.dataset.reloadPolicy || "default",
          });
          return;
        }
        const source = String(frame.dataset.instanceSrc || "");
        if (!source) return;
        const now = Date.now();
        const lastRecoverAt = Number(frame.dataset.lastRecoverAt || 0);
        if (lastRecoverAt > 0 && now - lastRecoverAt < minRecoverIntervalMs) return;
        frame.dataset.lastRecoverAt = String(now);
        debugLog("iframe recovered during runtime refresh", {
          reason,
          force,
          widgetIndex: Number(frame.dataset.widgetIndex || -1),
          state: state ? state.status : "unknown",
          url: source,
        });
        nudgeIframePaint(frame, reason);
        const separator = source.includes("?") ? "&" : "?";
        frame.src = "about:blank";
        window.setTimeout(() => {
          frame.src = `${source}${separator}_recover=${Date.now()}`;
        }, 80);
      });
    }

    const widgetPlaylistCache = new Map();
    let activeWidgetSignature = null;
    let lastRenderedSignature = null;
    let runtimeControlActive = false;

    function createMediaWidget(w, widgetIndex = -1) {
      const wrapper = document.createElement("div");
      wrapper.className = "widget media-widget";
      const mediaType = String(w.type || "").toLowerCase();

      if (mediaType === "image") {
        const image = document.createElement("img");
        image.src = String(w.url || "");
        image.alt = "Signage image";
        wrapper.appendChild(image);
        return wrapper;
      }

      const video = document.createElement("video");
      video.src = String(w.url || "");
      video.autoplay = w.autoplay !== false;
      video.muted = w.muted !== false;
      video.controls = w.controls === true;
      video.playsInline = true;
      video.loop = w.loop === true;
      video.preload = String(w.preload || "auto");
      video.disablePictureInPicture = true;

      const stallTimeoutMs = Number(w.stall_timeout_ms || 10000);
      const maxRecoveries = Number(w.max_stall_recoveries || 4);
      let recoveryCount = 0;
      let lastProgressAt = Date.now();
      let lastKnownTime = 0;
      debugLog("video widget init", {
        widgetIndex,
        url: video.src,
        autoplay: video.autoplay,
        muted: video.muted,
        loop: video.loop,
        preload: video.preload,
      });

      const markProgress = () => {
        lastProgressAt = Date.now();
        if (Number.isFinite(video.currentTime) && video.currentTime >= 0) {
          lastKnownTime = video.currentTime;
        }
      };

      const recoverFromStall = () => {
        if (video.ended || video.paused) return;
        if (recoveryCount >= Math.max(0, maxRecoveries)) return;

        recoveryCount += 1;
        debugLog("video recoverFromStall", { widgetIndex, url: video.currentSrc || video.src, recoveryCount });
        const resumeTime = Math.max(0, Number.isFinite(video.currentTime) ? video.currentTime : lastKnownTime);
        const currentSrc = String(video.currentSrc || video.src || "");
        if (!currentSrc) return;

        try {
          video.pause();
          video.src = "";
          video.load();
          video.src = currentSrc;
          video.load();
        } catch (_err) {
          // noop
        }

        const resumePlayback = () => {
          try {
            if (resumeTime > 0) {
              video.currentTime = resumeTime;
            }
          } catch (_err) {
            // noop
          }
          try {
            const maybePromise = video.play();
            if (maybePromise && typeof maybePromise.catch === "function") {
              maybePromise.catch(() => {});
            }
          } catch (_err) {
            // noop
          }
        };

        if (video.readyState >= 1) {
          resumePlayback();
        } else {
          video.addEventListener("loadedmetadata", resumePlayback, { once: true });
        }

        markProgress();
      };

      const stallMonitor = window.setInterval(() => {
        if (video.ended) {
          window.clearInterval(stallMonitor);
          return;
        }
        if (video.paused || video.seeking) return;
        if (Date.now() - lastProgressAt < Math.max(1500, stallTimeoutMs)) return;
        recoverFromStall();
      }, 1000);

      video.addEventListener("timeupdate", markProgress);
      video.addEventListener("progress", markProgress);
      video.addEventListener("playing", markProgress);
      video.addEventListener("waiting", () => {
        if (Date.now() - lastProgressAt >= Math.max(1500, stallTimeoutMs)) {
          recoverFromStall();
        }
      });
      video.addEventListener("stalled", recoverFromStall);
      video.addEventListener("error", recoverFromStall);
      video.addEventListener("error", () => {
        debugLog("video error", {
          widgetIndex,
          url: video.currentSrc || video.src,
          code: video.error ? video.error.code : null,
          networkState: video.networkState,
          readyState: video.readyState,
        });
      });
      video.addEventListener("playing", () => debugLog("video playing", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("pause", () => debugLog("video pause", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("canplay", () => debugLog("video canplay", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("loadedmetadata", () => {
        debugLog("video loadedmetadata", {
          widgetIndex,
          url: video.currentSrc || video.src,
          duration: Number.isFinite(video.duration) ? video.duration : null,
        });
      });
      video.addEventListener("loadstart", () => debugLog("video loadstart", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("loadeddata", () => debugLog("video loadeddata", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("suspend", () => debugLog("video suspend", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("stalled", () => debugLog("video stalled", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("waiting", () => debugLog("video waiting", { widgetIndex, url: video.currentSrc || video.src }));
      video.addEventListener("ended", () => window.clearInterval(stallMonitor), { once: true });
      video.addEventListener("emptied", () => window.clearInterval(stallMonitor), { once: true });

      const requestPlayback = () => {
        try {
          const maybePromise = video.play();
          if (maybePromise && typeof maybePromise.catch === "function") {
            maybePromise.catch(() => {});
          }
        } catch (_err) {
          // noop
        }
      };
      video.addEventListener("loadedmetadata", requestPlayback);
      video.addEventListener("canplay", requestPlayback);
      if (video.autoplay) {
        requestPlayback();
      }

      const startPositionSec = Number(w.start_position_sec || 0);
      if (Number.isFinite(startPositionSec) && startPositionSec > 0) {
        const seekToStart = () => {
          try {
            video.currentTime = startPositionSec;
          } catch (_err) {
            // noop
          }
        };
        video.addEventListener("loadedmetadata", seekToStart, { once: true });
      }
      wrapper.appendChild(video);
      return wrapper;
    }

    function createPlaylistWidget(w, widgetIndex = -1) {
      const wrapper = document.createElement("div");
      wrapper.className = "widget media-widget";
      const items = Array.isArray(w.items) ? w.items.filter((item) => item && typeof item === "object") : [];
      if (!items.length) {
        wrapper.classList.add("empty-cell");
        return wrapper;
      }

      const loopMode = String(w.loop_mode || "sequential").toLowerCase();
      let activeIndex = 0;
      let timeoutHandle = null;

      const clearScheduledAdvance = () => {
        if (timeoutHandle) {
          window.clearTimeout(timeoutHandle);
          timeoutHandle = null;
        }
      };

      const nextIndex = () => {
        if (!items.length) return 0;
        if (loopMode === "random") return Math.floor(Math.random() * items.length);
        return (activeIndex + 1) % items.length;
      };

      const renderItem = (index) => {
        clearScheduledAdvance();
        if (!items.length) return;
        wrapper.classList.remove("empty-cell");
        activeIndex = Math.max(0, Math.min(items.length - 1, Number(index) || 0));
        const item = items[activeIndex];
        wrapper.innerHTML = "";

        const itemType = String(item.type || "").toLowerCase();
        if (itemType === "image" || itemType === "video") {
          const mediaWidget = createMediaWidget(item, widgetIndex);
          mediaWidget.classList.remove("widget");
          wrapper.appendChild(mediaWidget.firstChild || mediaWidget);
          const durationSec = Number(item.duration_sec || 0);
          if (itemType === "image" && durationSec > 0) {
            timeoutHandle = window.setTimeout(() => renderItem(nextIndex()), durationSec * 1000);
          } else if (itemType === "video") {
            const video = wrapper.querySelector("video");
            if (video) {
              video.loop = false;
              video.addEventListener("ended", () => renderItem(nextIndex()), { once: true });
              if (durationSec > 0) {
                timeoutHandle = window.setTimeout(() => renderItem(nextIndex()), durationSec * 1000);
              }
            }
          }
          return;
        }

        if (itemType === "iframe") {
          const frame = document.createElement("iframe");
          frame.className = "widget";
          frame.loading = "eager";
          frame.scrolling = "no";
          frame.referrerPolicy = "no-referrer";
          frame.allow = "autoplay";
          frame.allowFullscreen = true;
          wrapper.appendChild(frame);
          scheduleIframeLoad(frame, item.url, widgetIndex, item.reload_policy);
        } else if (itemType === "card" || itemType === "html" || itemType === "embed") {
          const embed = document.createElement("div");
          embed.className = "widget card";
          embed.innerHTML = String(item.html || item.content || "");
          wrapper.appendChild(embed);
        } else {
          wrapper.classList.add("empty-cell");
          return;
        }

        const durationSec = Number(item.duration_sec || 0);
        if (durationSec > 0) {
          timeoutHandle = window.setTimeout(() => renderItem(nextIndex()), durationSec * 1000);
        }
      };

      wrapper.__cleanup = () => clearScheduledAdvance();
      renderItem(0);
      return wrapper;
    }

    function cleanupMediaElements(container) {
      container.querySelectorAll(".media-widget, .widget").forEach((node) => {
        if (node && typeof node.__cleanup === "function") {
          try {
            node.__cleanup();
          } catch (_err) {
            // noop
          }
        }
      });
      container.querySelectorAll("video").forEach((video) => {
        try {
          video.pause();
        } catch (_err) {
          // noop
        }
        try {
          video.removeAttribute("src");
          video.load();
        } catch (_err) {
          // noop
        }
      });

      container.querySelectorAll("img").forEach((image) => {
        try {
          image.removeAttribute("src");
        } catch (_err) {
          // noop
        }
      });
    }

    function loadWidgets(config) {
      const container = document.getElementById("widgets");
      if (typeof container.__productionGridCleanup === "function") container.__productionGridCleanup();
      cleanupMediaElements(container);
      container.innerHTML = "";
      const widgetCount = Array.isArray(config.widgets) ? config.widgets.length : 0;
      const columns = Array.isArray(config.columns) ? config.columns.length : Number(config.columns || 1);
      const cols = Math.max(1, Number(columns) || 1);
      const singleIframeMode =
        widgetCount === 1 &&
        String((config.widgets[0] && config.widgets[0].type) || "").toLowerCase() === "iframe";
      const productionGrid = widgetCount > 0 && config.widgets.every(isProductionAutoFitWidget);
      const productionStage = productionGrid ? document.createElement("div") : null;
      if (productionStage) {
        productionStage.className = "production-grid-stage";
        container.appendChild(productionStage);
      }
      const widgetHost = productionStage || container;

      (config.widgets || []).forEach((w, index) => {
        if (isCellCoveredByPreviousSpan(config.widgets, index, cols)) {
          return;
        }
        const rowIndex = Math.floor(index / cols);
        const colIndex = index % cols;
        const maxColSpan = Math.max(1, cols - colIndex);
        const maxRowSpan = Math.max(1, Number(config.rows || Math.ceil(widgetCount / cols) || 1) - rowIndex);
        const colSpan = Math.max(1, Math.min(maxColSpan, parseSpanValue(w, ["col_span", "colspan", "column_span", "merge_cols"], 1)));
        const rowSpan = Math.max(1, Math.min(maxRowSpan, parseSpanValue(w, ["row_span", "rowspan", "merge_rows"], 1)));
        const widgetType = String((w && w.type) || "").toLowerCase();
        if (widgetType === "iframe") {
          const wrapper = document.createElement("div");
          wrapper.className = "widget iframe-widget";
          const productionAutoFit = isProductionAutoFitWidget(w);
          if (productionAutoFit) wrapper.classList.add("production-auto-fit");
          if (colSpan > 1) {
            wrapper.style.gridColumn = `span ${colSpan}`;
          }
          if (rowSpan > 1) {
            wrapper.style.gridRow = `span ${rowSpan}`;
          }

          const frame = document.createElement("iframe");
          frame.className = "widget";
          frame.loading = "eager";
          frame.scrolling = "no";
          frame.referrerPolicy = "no-referrer";
          frame.allow = "autoplay";
          frame.allowFullscreen = true;
          const stablePolicy = String(w.reload_policy || "").toLowerCase() === "stable";
          frame.dataset.reloadPolicy = stablePolicy ? "stable" : "default";

          const enforceIframeVideosMuted = () => {
            try {
              const frameDocument = frame.contentDocument;
              if (!frameDocument) return;
              frameDocument.querySelectorAll("video").forEach((videoElement) => {
                try {
                  videoElement.muted = true;
                  videoElement.defaultMuted = true;
                  videoElement.autoplay = true;
                  videoElement.playsInline = true;
                  const maybePromise = videoElement.play();
                  if (maybePromise && typeof maybePromise.catch === "function") {
                    maybePromise.catch(() => {});
                  }
                } catch (_err) {
                  // noop
                }
              });
            } catch (_err) {
              // Cross-origin iframe; autoplay is delegated via Permissions Policy allow attribute.
            }
          };

          frame.addEventListener("load", () => {
            enforceIframeVideosMuted();
            if (stablePolicy) {
              window.setTimeout(() => nudgeIframePaint(frame, "iframe_load_stable"), 250);
              return;
            }
            nudgeIframePaint(frame, "iframe_load");
            [400, 1200, 2500].forEach((delayMs) => {
              window.setTimeout(enforceIframeVideosMuted, delayMs);
              window.setTimeout(() => nudgeIframePaint(frame, `iframe_load_${delayMs}`), delayMs);
            });
          });

          let updateProductionFit = null;
          if (productionAutoFit) {
            const stage = document.createElement("div");
            stage.className = "production-fit-stage";
            stage.appendChild(frame);
            wrapper.appendChild(stage);
            updateProductionFit = setupProductionAutoFit(wrapper, stage, w, index, config);
          } else {
            wrapper.appendChild(frame);
          }
          wrapper.appendChild(buildIframeFallback(w.url));
          scheduleIframeLoad(frame, w.url, index, w.reload_policy, updateProductionFit);
          window.setTimeout(() => {
            try {
              frame.style.transform = "translateZ(0)";
            } catch (_err) {
              // noop
            }
          }, 0);
          attachIframeBlockDetection(wrapper, frame, () => {
            if (!runtimeControlActive && singleIframeMode && w.url && window.location.href !== w.url) {
              window.location.replace(w.url);
            }
          });
          widgetHost.appendChild(wrapper);
          return;
        }
        if (widgetType === "card") {
          const card = document.createElement("div");
          card.className = "widget card";
          if (colSpan > 1) {
            card.style.gridColumn = `span ${colSpan}`;
          }
          if (rowSpan > 1) {
            card.style.gridRow = `span ${rowSpan}`;
          }
          card.innerHTML = w.html || "";
          widgetHost.appendChild(card);
          return;
        }
        if (widgetType === "embed") {
          const embed = document.createElement("div");
          embed.className = "widget card";
          if (colSpan > 1) {
            embed.style.gridColumn = `span ${colSpan}`;
          }
          if (rowSpan > 1) {
            embed.style.gridRow = `span ${rowSpan}`;
          }
          embed.innerHTML = w.html || "";
          Array.from(embed.querySelectorAll("script")).forEach((scriptNode) => {
            const runnable = document.createElement("script");
            Array.from(scriptNode.attributes).forEach((attr) => {
              runnable.setAttribute(attr.name, attr.value);
            });
            if (scriptNode.textContent) {
              runnable.textContent = scriptNode.textContent;
            }
            scriptNode.replaceWith(runnable);
          });
          widgetHost.appendChild(embed);
          return;
        }
        if (widgetType === "video" || widgetType === "image") {
          const mediaWidget = createMediaWidget(w, index);
          if (colSpan > 1) {
            mediaWidget.style.gridColumn = `span ${colSpan}`;
          }
          if (rowSpan > 1) {
            mediaWidget.style.gridRow = `span ${rowSpan}`;
          }
          widgetHost.appendChild(mediaWidget);
          return;
        }
        if (widgetType === "playlist") {
          const playlistWidget = createPlaylistWidget(w, index);
          if (colSpan > 1) {
            playlistWidget.style.gridColumn = `span ${colSpan}`;
          }
          if (rowSpan > 1) {
            playlistWidget.style.gridRow = `span ${rowSpan}`;
          }
          widgetHost.appendChild(playlistWidget);
          return;
        }
        if (widgetType === "empty") {
          const empty = document.createElement("div");
          empty.className = "widget empty-cell";
          if (colSpan > 1) {
            empty.style.gridColumn = `span ${colSpan}`;
          }
          if (rowSpan > 1) {
            empty.style.gridRow = `span ${rowSpan}`;
          }
          widgetHost.appendChild(empty);
          return;
        }
      });
      if (productionStage) {
        container.__productionGridCleanup = optimizeProductionGrid(container, productionStage, config);
      }
    }

    function syncPlaylistCache(syncPayload) {
      const payload = syncPayload && typeof syncPayload === "object" ? syncPayload : {};
      const items = Array.isArray(payload.items) ? payload.items : [];
      const nextMap = new Map();
      items.forEach((item) => {
        if (!item || typeof item !== "object") return;
        const signature = String(item.signature || "").trim();
        if (!signature) return;
        const normalizedConfig = normalizeConfig(item.payload);
        nextMap.set(signature, normalizedConfig);
      });

      widgetPlaylistCache.clear();
      nextMap.forEach((value, key) => widgetPlaylistCache.set(key, value));

      const nextActiveSignature = typeof payload.active_signature === "string"
        ? payload.active_signature.trim()
        : "";
      if (nextActiveSignature && widgetPlaylistCache.has(nextActiveSignature)) {
        activeWidgetSignature = nextActiveSignature;
      } else if (!nextActiveSignature || !widgetPlaylistCache.has(nextActiveSignature)) {
        activeWidgetSignature = null;
      }

      if (activeWidgetSignature && widgetPlaylistCache.has(activeWidgetSignature)) {
        const config = widgetPlaylistCache.get(activeWidgetSignature);
        if (activeWidgetSignature === lastRenderedSignature) {
          // layout_update renders the active dashboard first. A following playlist_sync
          // can arrive milliseconds later with the same signature; re-rendering here
          // tears down in-flight iframes and may leave one of the dashboard cells
          // stuck on its own loading state. Keep the already-rendered widgets alive
          // and only refresh the playlist cache.
          debugLog("playlist sync skipped active rerender", { signature: activeWidgetSignature });
          // WebView2 sometimes keeps cross-origin dashboard iframes on their own
          // loading spinner after a hidden warm runtime is foregrounded. Mouse
          // hover fixing the cell points to a paint/compositor issue, so first
          // nudge the iframe surface. Only non-ready frames continue to reload.
          recoverUnsettledIframes("playlist_sync_same_signature", { force: false, minRecoverIntervalMs: 30000 });
          return;
        }
        lastRenderedSignature = activeWidgetSignature;
        applyLayout(config);
        loadWidgets(config);
      }
    }

    function renderConfig(input, signature) {
      if (input && typeof input === "object" && Object.prototype.hasOwnProperty.call(input, "__playlist_sync")) {
        syncPlaylistCache(input.__playlist_sync);
        return;
      }

      const config = normalizeConfig(input);
      const normalizedSignature = typeof signature === "string" ? signature.trim() : "";
      if (normalizedSignature && normalizedSignature === lastRenderedSignature) {
        const cached = widgetPlaylistCache.get(normalizedSignature) || config;
        applyLayout(cached);
        document.querySelectorAll(".iframe-widget iframe[data-instance-src]").forEach((frame) => {
          debugLog("iframe same signature kept alive", {
            widgetIndex: Number(frame.dataset.widgetIndex || -1),
            reloadPolicy: frame.dataset.reloadPolicy || "default",
          });
        });
        recoverUnsettledIframes("same_signature", { force: false, minRecoverIntervalMs: 30000 });
        return;
      }
      if (normalizedSignature) {
        widgetPlaylistCache.set(normalizedSignature, config);
        activeWidgetSignature = normalizedSignature;
      } else {
        activeWidgetSignature = null;
      }
      lastRenderedSignature = normalizedSignature || null;
      applyLayout(config);
      loadWidgets(config);
    }

    window.__baylanApplyRuntimeConfig = function(payload, signature) {
      runtimeControlActive = true;
      renderConfig(payload, signature);
    };

    if (window.__baylanPendingConfig) {
      const pendingConfig = window.__baylanPendingConfig;
      window.__baylanPendingConfig = null;
      renderConfig(pendingConfig, null);
    }

    window.addEventListener("message", (event) => {
      try {
        const payload = normalizeConfig(event.data);
        renderConfig(payload, null);
      } catch (_err) {
        renderConfig({ widgets: [] }, null);
      }
    });

    renderConfig(parseConfig(), null);
  </script>
</body>
</html>
