<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Giriş</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <style>
    body { min-height: 100vh; display:flex; align-items:center; justify-content:center; background:#e2e8f0; }
    .login-card { width:100%; max-width:420px; border:0; border-radius:14px; box-shadow:0 8px 25px rgba(15,23,42,.1); }
    .login-logo { max-height:96px; max-width:100%; width:auto; display:block; margin:0 auto 1rem; }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="card-body p-4">
      <img
        class="login-logo"
        src="/static/images/baylan-login-logo.png"
        alt="Baylan Logo"
      />
      <h1 class="h4 mb-3 text-center">Baylan Bilgi Ekranı Giriş</h1>
      <form onsubmit="handleSubmit(event)">
        <div class="mb-3">
          <label class="form-label" for="username">Kullanıcı adı</label>
          <input id="username" class="form-control" autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Parola</label>
          <input id="password" class="form-control" type="password" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
        <div id="error" class="text-danger small mt-3"></div>
      </form>
    </div>
  </div>
<script>
function handleSubmit(event){
  event.preventDefault();
  login();
}

async function login(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  const resp = await fetch('/api/panel/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const body = await resp.json();
  if(!body.ok){
    document.getElementById('error').textContent = body.error || 'Giriş başarısız';
    return;
  }
  window.location.href = '/panel';
}
</script>
</body>
</html>
